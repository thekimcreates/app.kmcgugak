<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="The KMC Gugak member app: performances, your profile, and team conversations."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/branding/kmc-gugak-circlelogo.png" />
    <link
      rel="apple-touch-icon"
      href="./assets/branding/kmc-gugak-circlelogo.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./desktop.css" />
    <title>KMC Gugak Members</title>
  </head>
  <body>
    <div id="app">
      <div id="status" role="status" aria-live="polite"></div>
      <main id="main">
        <section id="home" class="page"></section>
        <section id="performances" class="page" hidden>
          <iframe
            id="performance-frame"
            title="Performances and galleries"
            data-src="./performances.html"
          ></iframe>
        </section>
        <section id="chat" class="page" hidden></section>
        <section id="settings" class="page" hidden></section>
        <section id="profile" class="page" hidden></section>
      </main>
      <nav id="tabs" aria-label="Main navigation"></nav>
      <div id="layers"></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <noscript
      >This app needs JavaScript to connect to your team’s Firebase
      data.</noscript
    >
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
